<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin - SENTEL LUXE ☁️</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}</script>
<style>.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(24px);box-shadow:0 12px 40px rgba(0,0,0,.06)} .card{border-radius:18px;background:white;box-shadow:0 8px 24px rgba(0,0,0,.06)} .btn{border-radius:999px;font-weight:800}</style>
</head>
<body class="bg-[#F6FFFE] min-h-screen">
<div id="loginScreen" class="min-h-screen grid place-items-center p-4 bg-gradient-to-br from-zinc-900 to-[#0B7A6E]">
<div class="glass rounded-[24px] p-8 w-full max-w-[380px] text-center"><div class="text-[26px] font-black">SENTEL<span class="text-[#0B7A6E]">LUXE</span> <span class="block text-[10px] tracking-widest">ADMIN</span></div><input id="passInput" type="password" placeholder="admin123" class="w-full mt-6 border-2 rounded-full px-5 py-3 text-center"><button id="loginBtn" class="w-full mt-4 py-3 bg-zinc-900 text-white rounded-full font-bold">دخول</button><a href="index.html" class="block mt-4 text-[11px] underline">المتجر</a></div>
</div>

<div id="panelScreen" class="hidden max-w-[1200px] mx-auto p-4">
<header class="flex justify-between items-center mb-6"><h1 class="text-[24px] font-black">لوحة التحكم ☁️</h1><a href="index.html" target="_blank" class="px-4 py-2 bg-white border rounded-full text-[12px]">المتجر</a></header>

<div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
<div class="glass rounded-[16px] p-4"><div class="text-[11px] text-zinc-500">المنتجات السحابية</div><div id="st-count" class="text-[22px] font-black">0</div></div>
<div class="glass rounded-[16px] p-4"><div class="text-[11px] text-zinc-500">صالحة</div><div id="st-valid" class="text-[18px] font-bold text-green-600">0</div></div>
<div class="glass rounded-[16px] p-4"><div class="text-[11px] text-zinc-500">خاوية</div><div id="st-invalid" class="text-[18px] font-bold text-red-600">0</div></div>
</div>

<div class="flex gap-2 overflow-auto mb-6">
<button onclick="switchTab('products')" id="btn-products" class="px-6 py-3 rounded-full bg-zinc-900 text-white font-bold text-[13px] whitespace-nowrap">🧴 العطور</button>
<button onclick="switchTab('slider')" id="btn-slider" class="px-6 py-3 rounded-full bg-white border font-bold text-[13px] whitespace-nowrap">🎞️ السلايدر</button>
<button onclick="switchTab('logo')" id="btn-logo" class="px-6 py-3 rounded-full bg-white border font-bold text-[13px] whitespace-nowrap">🖼️ اللوغو</button>
</div>

<div id="tab-products" class="tabView">
<div class="card p-5 mb-6 border-2 border-green-200"><h3 class="font-bold mb-3">إضافة عطر - يجب ملء الاسم والثمن والصورة</h3>
<div class="grid sm:grid-cols-2 gap-3">
<input id="p-name" placeholder="الاسم * مطلوب" class="border-2 rounded-xl px-4 py-3 text-[14px] bg-white">
<input id="p-price" type="number" placeholder="الثمن * مطلوب 149" class="border-2 rounded-xl px-4 py-3 text-[14px] bg-white">
<input id="p-cat" placeholder="التصنيف" class="border rounded-xl px-4 py-3 text-[13px] bg-white">
<label class="flex items-center gap-2 border rounded-xl px-4 py-3 bg-white"><input id="p-best" type="checkbox"> Bestseller</label>
<textarea id="p-desc" placeholder="الوصف" class="sm:col-span-2 border rounded-xl px-4 py-3 text-[13px] bg-white"></textarea>
<div class="sm:col-span-2"><input id="p-image" type="file" accept="image/*" class="w-full border-2 border-dashed rounded-xl p-3 bg-white"><img id="p-preview" class="mt-3 w-24 h-24 object-contain hidden rounded-xl bg-zinc-50 border"></div>
</div>
<button id="btnAdd" class="mt-4 w-full py-3 bg-[#0B7A6E] text-white rounded-full font-bold">☁️ رفع للسحابة</button>
<p class="text-[10px] text-zinc-500 mt-2">⚠️ يجب ملء الاسم والثمن - وإلا سيظهر undefined</p>
</div>

<div id="invalidBox" class="hidden mb-4 p-4 bg-red-50 border-2 border-red-200 rounded-[16px]"><p class="font-bold text-[13px] text-red-700">⚠️ يوجد <span id="invalidCount">0</span> منتجات خاوية تمنع ظهور المتجر</p><button onclick="cleanInvalid()" class="mt-2 px-5 py-2 bg-red-600 text-white rounded-full text-[12px] font-bold">🗑️ حذف الخاوية الآن</button></div>

<div id="productsList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
</div>

<div id="tab-slider" class="tabView hidden"><div class="card p-5"><div id="sliderEdits"></div><div class="flex gap-2 mt-4"><button id="btnAddSlide" class="px-5 py-2 bg-white border rounded-full">+ شريحة</button><button id="btnSaveSlider" class="flex-1 py-2 bg-zinc-900 text-white rounded-full">حفظ السلايدر</button></div></div></div>
<div id="tab-logo" class="tabView hidden"><div class="card p-6 max-w-[500px]"><input id="logoTextInput" class="w-full border rounded-xl px-4 py-3 mb-3" placeholder="SENTEL LUXE"><input id="logoImageInput" type="file" accept="image/*" class="w-full border-2 border-dashed rounded-xl p-3 mb-3"><img id="logoPreview" class="h-16 hidden"><button id="btnSaveLogo" class="w-full py-3 bg-zinc-900 text-white rounded-full">حفظ اللوغو</button></div></div>
</div>

<script>
document.getElementById('loginBtn').onclick=()=>{if(document.getElementById('passInput').value==='admin123'){document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('panelScreen').classList.remove('hidden'); if(window.afterLogin) afterLogin();}else alert('admin123')};
document.getElementById('passInput').onkeydown=e=>{if(e.key==='Enter') document.getElementById('loginBtn').click()};
window.switchTab=n=>{document.querySelectorAll('.tabView').forEach(v=>v.classList.add('hidden')); document.getElementById('tab-'+n).classList.remove('hidden'); document.querySelectorAll('[id^="btn-"]').forEach(b=>{b.classList.remove('bg-zinc-900','text-white'); b.classList.add('bg-white','border')}); document.getElementById('btn-'+n).classList.add('bg-zinc-900','text-white'); document.getElementById('btn-'+n).classList.remove('bg-white','border')};
</script>

<script type="module">
import {initializeApp} from 'firebase/app';
import {getFirestore, collection, addDoc, deleteDoc, doc, setDoc, onSnapshot, getDoc, getDocs} from 'firebase/firestore';
const firebaseConfig={apiKey:"AIzaSyDwrJ2FR0NVggoXeKchu2YGqqam5ZFMZXU",authDomain:"parfum-e53ad.firebaseapp.com",projectId:"parfum-e53ad",storageBucket:"parfum-e53ad.firebasestorage.app",messagingSenderId:"791467480753",appId:"1:791467480753:web:4c370b7e3635a37686f490"};
const db=getFirestore(initializeApp(firebaseConfig));
let siteConfig={}, curImg='', logoImg='';
const $=id=>document.getElementById(id);
const toB=(f,m=600)=>new Promise(r=>{const fr=new FileReader(); fr.onload=e=>{const im=new Image(); im.onload=()=>{const c=document.createElement('canvas'); let w=im.width,h=im.height; if(w>m){h=h*m/w; w=m;} c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); r(c.toDataURL('image/jpeg',0.8));}; im.src=e.target.result;}; fr.readAsDataURL(f);});

$('p-image').addEventListener('change', async e=>{const f=e.target.files[0]; if(!f) return; curImg=await toB(f,600); $('p-preview').src=curImg; $('p-preview').classList.remove('hidden');});
$('logoImageInput').addEventListener('change', async e=>{logoImg=await toB(e.target.files[0],400); $('logoPreview').src=logoImg; $('logoPreview').classList.remove('hidden');});

window.afterLogin=()=>{
 onSnapshot(collection(db,'parfums'), snap=>{
  const all=snap.docs;
  const valid=all.filter(d=>{const p=d.data(); return p.name && p.name!=='undefined' && p.name.trim().length>1 && p.price});
  const invalid=all.filter(d=>{const p=d.data(); return !p.name || p.name==='undefined' || !p.price});
  $('st-count').textContent=all.length;
  $('st-valid').textContent=valid.length;
  $('st-invalid').textContent=invalid.length;
  if(invalid.length>0){$('invalidBox').classList.remove('hidden'); $('invalidCount').textContent=invalid.length;}else{$('invalidBox').classList.add('hidden');}
  $('productsList').innerHTML=valid.map(d=>{
   const p=d.data();
   return `<div class="card p-3 flex gap-3"><img src="${p.imageBase64||p.image||''}" class="w-14 h-14 object-contain bg-zinc-50 rounded-lg border"><div class="flex-1"><p class="font-bold text-[13px]">${p.name}</p><p class="text-[12px] text-[#0B7A6E]">${p.price} MAD</p><button onclick="del('${d.id}')" class="text-[11px] text-red-500 mt-1">حذف</button></div></div>`;
  }).join('') || '<div class="py-10 text-center text-zinc-400">لا يوجد منتجات صالحة - أضف منتجات بالاسم والثمن</div>';
 });
 getDoc(doc(db,'config','site')).then(s=>{if(s.exists()){siteConfig=s.data(); $('logoTextInput').value=siteConfig.logoText||''; renderSlider();}});
};

window.del=async id=>{if(confirm('حذف؟')) await deleteDoc(doc(db,'parfums',id));};
window.cleanInvalid=async()=>{
 if(!confirm(`حذف ${$('st-invalid').textContent} منتجات خاوية؟`)) return;
 const snap=await getDocs(collection(db,'parfums'));
 let c=0;
 for(const d of snap.docs){const p=d.data(); if(!p.name || p.name==='undefined' || !p.price){await deleteDoc(doc(db,'parfums',d.id)); c++;}}
 alert(`تم حذف ${c} منتجات خاوية`);
};

$('btnAdd').onclick=async()=>{
 const name=$('p-name').value.trim(), price=Number($('p-price').value), cat=$('p-cat').value, desc=$('p-desc').value, best=$('p-best').checked;
 if(!name){alert('❌ الاسم مطلوب - اكتب اسم العطر'); return;}
 if(!price){alert('❌ الثمن مطلوب'); return;}
 if(!curImg){alert('❌ الصورة مطلوبة'); return;}
 $('btnAdd').textContent='⏳ جاري الرفع...'; $('btnAdd').disabled=true;
 try{
  await addDoc(collection(db,'parfums'),{name, price, category:cat, description:desc, bestseller:best, imageBase64:curImg, image:curImg, created:Date.now()});
  alert('✅ تم - المنتج الآن يظهر في المتجر في أي جهاز');
  $('p-name').value=''; $('p-price').value=''; curImg=''; $('p-preview').classList.add('hidden'); $('p-image').value='';
 }catch(e){alert('خطأ: '+e.message);}
 $('btnAdd').textContent='☁️ رفع للسحابة'; $('btnAdd').disabled=false;
};

function renderSlider(){
 const slider=siteConfig.slider||[];
 $('sliderEdits').innerHTML=slider.map((sl,i)=>`<div class="border rounded-xl p-3 mb-3 bg-white"><input data-i="${i}" data-k="title" value="${sl.title||''}" class="w-full border rounded px-3 py-2 mb-2 text-[13px]"><input data-i="${i}" data-k="sub" value="${sl.sub||''}" class="w-full border rounded px-3 py-2 mb-2 text-[12px]"><div class="flex gap-2"><input type="file" data-i="${i}" class="slFile flex-1 text-[11px] border-2 border-dashed rounded p-2"><img src="${sl.img||''}" class="h-10 w-16 object-cover rounded border"></div></div>`).join('');
 document.querySelectorAll('.slFile').forEach(inp=>{inp.addEventListener('change', async e=>{const b=await toB(e.target.files[0],1200); siteConfig.slider[e.target.dataset.i].img=b; e.target.nextElementSibling.src=b;});});
 document.querySelectorAll('#sliderEdits input[data-k]').forEach(inp=>{inp.addEventListener('input', e=>{siteConfig.slider[e.target.dataset.i][e.target.dataset.k]=e.target.value});});
}
$('btnAddSlide').onclick=()=>{siteConfig.slider=siteConfig.slider||[]; siteConfig.slider.push({title:'عنوان جديد', sub:'وصف', img:'https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=1600&q=80'}); renderSlider();};
$('btnSaveSlider').onclick=async()=>{await setDoc(doc(db,'config','site'),{slider:siteConfig.slider},{merge:true}); alert('تم حفظ السلايدر');};
$('btnSaveLogo').onclick=async()=>{const u={logoText:$('logoTextInput').value}; if(logoImg) u.logoImage=logoImg; await setDoc(doc(db,'config','site'),{...siteConfig,...u},{merge:true}); alert('تم حفظ اللوغو');};
</script>
</body>
</html>
