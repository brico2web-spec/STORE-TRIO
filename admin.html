<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المجانية | إدارة المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #0b0d10; color: #f3f4f6; }</style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto">

    <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <h1 class="text-2xl font-bold text-amber-400"><i class="fa-solid fa-sliders ml-2"></i> لوحة تحكم المتجر (خطة مجانية)</h1>
        <a href="index.html" class="text-sm bg-gray-800 px-4 py-2 rounded-xl text-gray-300 hover:bg-gray-700">الرجوع للواجهة</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- إضافة منتج جديد -->
        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
            <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-plus text-amber-400 ml-2"></i> إضافة عطر جديد</h2>
            <form id="add-product-form" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">اسم العطر</label>
                    <input type="text" id="p-name" required class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">السعر (درهم)</label>
                    <input type="number" id="p-price" required class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">اختر صورة العطر من هاتفك / جهازك</label>
                    <input type="file" id="p-file" accept="image/*" required class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2 text-gray-300 focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-black hover:file:bg-amber-400">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">الوصف</label>
                    <textarea id="p-desc" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500" rows="3"></textarea>
                </div>

                <div id="upload-status" class="text-amber-400 text-sm hidden font-bold">جاري رفع الصورة مجاناً وحفظ العطر... ⏳</div>

                <button type="submit" id="btn-submit" class="w-full bg-amber-500 text-black font-bold py-3 rounded-xl hover:bg-amber-400 transition">إضافة العطر للمتجر</button>
            </form>
        </div>

        <!-- إضافة صورة للسلايدر -->
        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
            <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-images text-amber-400 ml-2"></i> إضافة صورة لسلايدر الواجهة</h2>
            <form id="add-slider-form" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">اختر صورة السلايدر من جهازك</label>
                    <input type="file" id="s-file" accept="image/*" required class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2 text-gray-300 focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-black hover:file:bg-amber-400">
                </div>
                <div id="slider-status" class="text-amber-400 text-sm hidden font-bold">جاري رفع صورة السلايدر... ⏳</div>
                <button type="submit" id="btn-slider-submit" class="w-full bg-amber-500 text-black font-bold py-3 rounded-xl hover:bg-amber-400 transition">إضافة للسلايدر</button>
            </form>
        </div>

    </div>

    <!-- Firebase SDK (Firestore Only) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyOwrJ2FRONVggeXeKcnuZYOq...",
            authDomain: "parfum-e53ad.firebaseapp.com",
            projectId: "parfum-e53ad",
            storageBucket: "parfum-e53ad.firebasestorage.app",
            messagingSenderId: "791467480753",
            appId: "1:791467480753:web:4c370bfe3635a37686f490"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // مفتاح مجاني لرفع الصور
        const IMGBB_API_KEY = "c8942df154edbe72e3a793a38ee5d0a6";

        // دالة رفع الصورة مجاناً إلى ImgBB
        async function uploadImageFree(file) {
            const formData = new FormData();
            formData.append("image", file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const data = await res.json();
            if (data.success) {
                return data.data.url;
            } else {
                throw new Error("فشل رفع الصورة");
            }
        }

        // رفع وإضافة المنتج
        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('upload-status');
            const btn = document.getElementById('btn-submit');
            const file = document.getElementById('p-file').files[0];

            if (!file) return;

            try {
                status.classList.remove('hidden');
                btn.disabled = true;

                // 1. رفع الصورة مجاناً
                const imageUrl = await uploadImageFree(file);

                // 2. حفظ البيانات فقط في Firestore الموضحة في صورتك
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('p-name').value,
                    price: document.getElementById('p-price').value,
                    imageUrl: imageUrl,
                    description: document.getElementById('p-desc').value,
                    createdAt: new Date()
                });

                alert('✅ تم إضافة العطر والصورة بنجاح!');
                e.target.reset();
            } catch (err) {
                alert('❌ حدث خطأ: ' + err.message);
            } finally {
                status.classList.add('hidden');
                btn.disabled = false;
            }
        });

        // رفع وإضافة صورة السلايدر
        document.getElementById('add-slider-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('slider-status');
            const btn = document.getElementById('btn-slider-submit');
            const file = document.getElementById('s-file').files[0];

            if (!file) return;

            try {
                status.classList.remove('hidden');
                btn.disabled = true;

                const imageUrl = await uploadImageFree(file);

                await addDoc(collection(db, "slider"), {
                    url: imageUrl,
                    createdAt: new Date()
                });

                alert('✅ تم إضافة صورة السلايدر بنجاح!');
                e.target.reset();
            } catch (err) {
                alert('❌ حدث خطأ: ' + err.message);
            } finally {
                status.classList.add('hidden');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
