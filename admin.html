<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin - TRIO PARFUM ☁️</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}</script>
<style>.admin-card{border-radius:18px;background:white;box-shadow:0 8px 24px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.04)}</style>
</head>
<body class="bg-[#F6FFFE] min-h-screen">
<div id="loginScreen" class="min-h-screen grid place-items-center p-4 bg-gradient-to-br from-zinc-900 to-[#0B7A6E]">
  <div class="glass rounded-[24px] p-8 w-full max-w-[380px] text-center">
    <div class="text-[26px] font-black">TRIÖ<span class="text-[#0B7A6E]"> PARFUM</span><span class="block text-[10px] tracking-widest">ADMIN CLOUD</span></div>
    <input id="passInput" type="password" placeholder="admin123" class="w-full mt-6 border-2 rounded-full px-5 py-3 text-center">
    <button id="loginBtn" class="w-full mt-4 py-3 bg-zinc-900 text-white rounded-full font-bold">دخول</button>
    <a href="index.html" class="block mt-4 text-[11px] underline">المتجر</a>
  </div>
</div>
<div id="panelScreen" class="hidden max-w-[1200px] mx-auto p-4">
  <header class="flex justify-between items-center mb-6"><h1 class="text-[24px] font-black">لوحة التحكم ☁️ - Firebase مربوط</h1><a href="index.html" target="_blank" class="px-4 py-2 bg-white border rounded-full text-[12px]">المتجر</a></header>
  <div class="grid grid-cols-3 gap-3 mb-6">
    <div class="glass rounded-[16px] p-4"><div class="text-[11px] text-zinc-500">المنتجات السحابية</div><div id="st-count" class="text-[22px] font-black">0</div></div>
    <div class="glass rounded-[16px] p-4"><div class="text-[11px] text-zinc-500">صالحة</div><div id="st-valid" class="text-[18px] font-bold text-green-600">0</div></div>
    <div class="glass rounded-[16px] p-4"><div class="text-[11px] text-zinc-500">خاوية undefined</div><div id="st-invalid" class="text-[18px] font-bold text-red-600">0</div></div>
  </div>
  <div class="flex gap-2 overflow-auto mb-6">
    <button onclick="switchTab('products')" id="btn-products" class="px-6 py-3 rounded-full bg-zinc-900 text-white font-bold text-[13px]">🧴 العطور</button>
    <button onclick="switchTab('slider')" id="btn-slider" class="px-6 py-3 rounded-full bg-white border font-bold text-[13px]">🎞️ السلايدر</button>
    <button onclick="switchTab('logo')" id="btn-logo" class="px-6 py-3 rounded-full bg-white border font-bold text-[13px]">🖼️ اللوغو PNG</button>
  </div>
  <div id="tab-products">
    <div class="admin-card p-5 mb-6 border-2 border-green-200"><h3 class="font-bold mb-3">إضافة عطر - Firebase نفس الطريقة القديمة</h3>
      <div class="grid sm:grid-cols-2 gap-3">
        <input id="p-name" placeholder="الاسم * مطلوب" class="border-2 rounded-xl px-4 py-3 text-[14px] bg-white">
        <input id="p-price" type="number" placeholder="الثمن * مطلوب" class="border-2 rounded-xl px-4 py-3 text-[14px] bg-white">
        <input id="p-cat" placeholder="التصنيف" class="border rounded-xl px-4 py-3 text-[13px] bg-white">
        <label class="flex items-center gap-2 border rounded-xl px-4 py-3 bg-white"><input id="p-best" type="checkbox"> Bestseller</label>
        <textarea id="p-desc" placeholder="الوصف" class="sm:col-span-2 border rounded-xl px-4 py-3 text-[13px] bg-white"></textarea>
        <div class="sm:col-span-2"><input id="p-image" type="file" accept="image/*" class="w-full border-2 border-dashed rounded-xl p-3 bg-white"><img id="p-preview" class="mt-3 w-24 h-24 object-contain hidden rounded-xl bg-zinc-50 border"></div>
      </div>
      <button id="btnAdd" class="mt-4 w-full py-3 bg-[#0B7A6E] text-white rounded-full font-bold">☁️ رفع للسحابة - يظهر في أي جهاز</button>
    </div>
    <div id="invalidBox" class="hidden mb-4 p-4 bg-red-50 border-2 border-red-200 rounded-[16px]"><p class="font-bold text-[13px] text-red-700">⚠️ يوجد <span id="invalidCount">0</span> منتجات خاوية</p><button onclick="window.cleanInvalid()" class="mt-2 px-5 py-2 bg-red-600 text-white rounded-full text-[12px] font-bold">🗑️ حذف الخاوية</button></div>
    <div id="productsList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
  </div>
  <div id="tab-slider" class="hidden"><div class="admin-card p-5"><div id="sliderEdits"></div><div class="flex gap-2 mt-4"><button id="btnAddSlide" class="px-5 py-2 bg-white border rounded-full">+ شريحة</button><button id="btnSaveSlider" class="flex-1 py-2 bg-zinc-900 text-white rounded-full">حفظ السلايدر - Firebase</button></div></div></div>
  <div id="tab-logo" class="hidden"><div class="admin-card p-6 max-w-[500px]"><p class="text-[13px] font-bold mb-3">اللوغو PNG كبير وواضح - نفس التخزين القديم (config/site - logoImage)</p><input id="logoTextInput" class="w-full border rounded-xl px-4 py-3 mb-3" placeholder="TRIO PARFUM"><input id="logoImageInput" type="file" accept="image/*" class="w-full border-2 border-dashed rounded-xl p-3 mb-3"><img id="logoPreview" class="h-20 hidden object-contain border rounded-xl bg-white p-2"><button id="btnSaveLogo" class="w-full mt-3 py-3 bg-zinc-900 text-white rounded-full">حفظ اللوغو - يظهر كبير 92px</button></div></div>
</div>
<script>
document.getElementById('loginBtn').onclick=()=>{if(document.getElementById('passInput').value==='admin123'){document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('panelScreen').classList.remove('hidden'); if(window.afterLogin) afterLogin();}else alert('admin123')};
document.getElementById('passInput').onkeydown=e=>{if(e.key==='Enter') document.getElementById('loginBtn').click()};
window.switchTab=n=>{document.getElementById('tab-products').classList.add('hidden'); document.getElementById('tab-slider').classList.add('hidden'); document.getElementById('tab-logo').classList.add('hidden'); document.getElementById('tab-'+n).classList.remove('hidden'); document.querySelectorAll('[id^="btn-"]').forEach(b=>{b.classList.remove('bg-zinc-900','text-white'); b.classList.add('bg-white','border')}); document.getElementById('btn-'+n).classList.add('bg-zinc-900','text-white'); document.getElementById('btn-'+n).classList.remove('bg-white','border')};
</script>
<script type="module" src="admin.js"></script>
</body>
</html>
