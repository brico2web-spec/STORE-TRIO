window.upLogo=async(inp,type)=>{
 const f=inp.files[0]; if(!f) return; const b=await toBase64(f,700);
 if(type==='top'){S.logoTop=b; LS.set('sentel_logo_top',b)} else {S.logoFoot=b; LS.set('sentel_logo_footer',b)} save(); render()
}
window.upSlide=async(inp,i)=>{
 const f=inp.files[0]; if(!f) return; const b=await toBase64(f,1600); S.slider[i].img=b; save(); render()
}
window.upProd=async(inp,i)=>{
 const f=inp.files[0]; if(!f) return; const b=await toBase64(f,800); S.products[i].img=b; save(); render()
}
window.addProd=async()=>{
 const name=document.getElementById('np-name').value, price=Number(document.getElementById('np-price').value), oldN=Number(document.getElementById('np-old').value)||899, insp=document.getElementById('np-insp').value, stock=Number(document.getElementById('np-stock').value)||20, file=document.getElementById('np-img').files[0];
 if(!name||!price) return alert('الاسم والثمن ضروريين');
 let img='https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=600&q=90';
 if(file) img=await toBase64(file,800);
 S.products.push({id:Date.now(),name,price,old:oldN,insp:insp||'Inspiration',stock,rating:4.9,img}); save(); render(); document.getElementById('np-name').value=''; document.getElementById('np-prev').classList.add('hidden');
}
document.addEventListener('change', async e=>{
 if(e.target.id==='np-img'){ const b=await toBase64(e.target.files[0],400); document.getElementById('np-prev').src=b; document.getElementById('np-prev').classList.remove('hidden'); }
})
window.exportCSV=()=>{
 const header='N°,Date,Client,Telephone,Ville,Adresse,Produits,Total,Statut';
 const rows=S.orders.map(o=>`"${o.id}","${o.date}","${o.client||o.nom||''}","${o.phone||o.telephone||''}","${o.city||o.ville||''}","${(o.address||o.adresse||'').replace(/"/g,'""')}","${(o.products||o.produits||[]).map(p=>p.name+' x'+p.qty).join('; ').replace(/"/g,'""')}","${o.total}","${o.status||o.statut||''}"`).join('\n');
 const blob=new Blob([header+'\n'+rows],{type:'text/csv'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='sentel_orders.csv'; a.click();
}
</script>
