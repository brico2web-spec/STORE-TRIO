<!DOCTYPE html>
<html lang="fr" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Perfumes | Parfumerie de Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandGold: {
                            400: '#FBBF24',
                            500: '#D97706',
                            600: '#B45309',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', 'Cairo', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* 🌙 Dark Mode Theme (أسود ملكي مع خطوط بيضاء وذهبية شديدة الوضوح) */
        .dark body { background-color: #090a0f; color: #ffffff; }
        .dark .text-primary-title { color: #ffffff; }
        .dark .text-secondary-sub { color: #d1d5db; }
        .dark .gold-accent { color: #f59e0b; }
        .dark .card-box { background-color: #111827; border: 1px solid #374151; }
        .dark .pack-box { background: linear-gradient(180deg, #1f2937 0%, #111827 100%); border: 2px solid #d97706; }
        .dark .slot-card { background-color: #1f2937; border: 2px dashed #d97706; }
        .dark .slot-card:hover { background-color: #374151; }

        /* ☀️ Light Mode Theme (أبيض ناصع مع خطوط سوداء داكنة وذهبية واضحة جداً) */
        body:not(.dark) { background-color: #ffffff; color: #0f172a; }
        body:not(.dark) .text-primary-title { color: #0f172a; }
        body:not(.dark) .text-secondary-sub { color: #334155; }
        body:not(.dark) .gold-accent { color: #b45309; }
        body:not(.dark) .card-box { background-color: #f8fafc; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        body:not(.dark) .pack-box { background: linear-gradient(180deg, #fffbe3 0%, #ffffff 100%); border: 2px solid #b45309; box-shadow: 0 10px 25px -5px rgba(180, 83, 9, 0.15); }
        body:not(.dark) .slot-card { background-color: #ffffff; border: 2px dashed #b45309; }
        body:not(.dark) .slot-card:hover { background-color: #fef3c7; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <nav class="border-b border-amber-500/30 bg-white dark:bg-gray-950 sticky top-0 z-40 shadow-sm transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
            
            <!-- Logo / Brand -->
            <div id="nav-brand" class="flex items-center gap-3">
                <h1 class="text-base sm:text-xl font-black text-amber-600 dark:text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-spray-can-sparkles"></i> <span>ROYAL PARFUM</span>
                </h1>
            </div>

            <!-- Controls (Language Switcher + Dark/Light Toggle + Admin Link) -->
            <div class="flex items-center gap-2 sm:gap-3">
                
                <!-- Language Selector -->
                <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-amber-500/10 text-amber-700 dark:text-amber-400 border border-amber-500/40 text-xs font-extrabold rounded-xl px-2.5 py-1.5 focus:outline-none cursor-pointer">
                    <option value="FR" selected class="bg-white dark:bg-gray-900 text-black dark:text-white">FR 🇫🇷</option>
                    <option value="AR" class="bg-white dark:bg-gray-900 text-black dark:text-white">AR 🇲🇦</option>
                    <option value="EN" class="bg-white dark:bg-gray-900 text-black dark:text-white">EN 🇬🇧</option>
                </select>

                <!-- Theme Toggle Button -->
                <button id="theme-toggle" onclick="toggleTheme()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-amber-500/10 border border-amber-500/40 text-amber-700 dark:text-amber-400 hover:bg-amber-500 hover:text-white dark:hover:text-black transition">
                    <i id="theme-icon" class="fa-solid fa-sun text-sm"></i>
                </button>

                <!-- Admin Link -->
                <a href="admin.html" class="text-xs font-bold bg-amber-500/10 text-amber-700 dark:text-amber-400 border border-amber-500/40 px-3 py-1.5 rounded-xl hover:bg-amber-500 hover:text-white dark:hover:text-black transition flex items-center gap-1">
                    <i class="fa-solid fa-user-shield"></i> <span class="hidden md:inline" data-i18n="admin">Admin</span>
                </a>
            </div>

        </div>
    </nav>

    <!-- Hero / Slider -->
    <section class="relative overflow-hidden my-4 max-w-7xl mx-auto w-full px-3 sm:px-6">
        <div class="relative h-[200px] sm:h-[300px] md:h-[380px] rounded-2xl sm:rounded-3xl overflow-hidden card-box flex items-center justify-center">
            <img id="slider-img" src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=1200" class="absolute inset-0 w-full h-full object-cover opacity-25 dark:opacity-40 transition-opacity duration-700">
            <div class="relative z-10 text-center p-4">
                <h2 class="text-2xl sm:text-4xl md:text-5xl font-extrabold mb-2 text-primary-title" data-i18n="heroTitle">Monde des Parfums de Luxe</h2>
                <p class="text-secondary-sub text-xs sm:text-sm md:text-base font-bold" data-i18n="heroSub">Une collection exclusive aux touches boisées, fraîches et florales.</p>
            </div>
        </div>
    </section>

    <!-- ⚡ Pack Builder Section ⚡ -->
    <section class="max-w-4xl mx-auto px-3 sm:px-6 my-6 w-full">
        <div class="pack-box rounded-2xl sm:rounded-3xl p-4 sm:p-6 md:p-8 relative">
            <div class="flex justify-between items-center mb-4 sm:mb-6">
                <div>
                    <h3 id="display-offer-title" class="text-lg sm:text-2xl font-black text-primary-title" data-i18n="offerTitle">Composez votre Pack</h3>
                    <p id="display-offer-sub" class="text-[11px] sm:text-sm text-secondary-sub font-semibold mt-0.5" data-i18n="offerSub">Cliquez pour choisir 3 parfums parmi les plus vendus.</p>
                </div>
                <div class="bg-amber-500 text-white dark:text-black font-black px-3.5 py-1.5 rounded-full text-xs shadow" id="bundle-counter">
                    0/3
                </div>
            </div>

            <!-- Slots Grid -->
            <div class="grid grid-cols-3 gap-2 sm:gap-4 md:gap-6 my-4">
                <!-- Slot 0 -->
                <div onclick="openPerfumeSelector(0)" class="slot-card rounded-xl sm:rounded-2xl h-32 sm:h-44 md:h-52 flex flex-col items-center justify-center cursor-pointer transition relative overflow-hidden group p-2">
                    <div id="slot-content-0" class="flex flex-col items-center text-center">
                        <div class="w-9 h-9 sm:w-12 sm:h-12 rounded-full bg-amber-500/20 flex items-center justify-center mb-1.5 group-hover:scale-110 transition">
                            <i class="fa-solid fa-plus gold-accent text-base sm:text-xl"></i>
                        </div>
                        <span class="text-xs font-bold text-secondary-sub">1</span>
                    </div>
                </div>

                <!-- Slot 1 -->
                <div onclick="openPerfumeSelector(1)" class="slot-card rounded-xl sm:rounded-2xl h-32 sm:h-44 md:h-52 flex flex-col items-center justify-center cursor-pointer transition relative overflow-hidden group p-2">
                    <div id="slot-content-1" class="flex flex-col items-center text-center">
                        <div class="w-9 h-9 sm:w-12 sm:h-12 rounded-full bg-amber-500/20 flex items-center justify-center mb-1.5 group-hover:scale-110 transition">
                            <i class="fa-solid fa-plus gold-accent text-base sm:text-xl"></i>
                        </div>
                        <span class="text-xs font-bold text-secondary-sub">2</span>
                    </div>
                </div>

                <!-- Slot 2 -->
                <div onclick="openPerfumeSelector(2)" class="slot-card rounded-xl sm:rounded-2xl h-32 sm:h-44 md:h-52 flex flex-col items-center justify-center cursor-pointer transition relative overflow-hidden group p-2">
                    <div id="slot-content-2" class="flex flex-col items-center text-center">
                        <div class="w-9 h-9 sm:w-12 sm:h-12 rounded-full bg-amber-500/20 flex items-center justify-center mb-1.5 group-hover:scale-110 transition">
                            <i class="fa-solid fa-plus gold-accent text-base sm:text-xl"></i>
                        </div>
                        <span class="text-xs font-bold text-secondary-sub">3</span>
                    </div>
                </div>
            </div>

            <!-- Price & Submit Button -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4 mt-4 sm:mt-6 pt-4 border-t border-amber-500/30">
                <div class="text-center ltr:sm:text-left rtl:sm:text-right">
                    <span class="text-xs text-secondary-sub block font-bold" data-i18n="totalPrice">Prix total du pack:</span>
                    <span id="display-offer-price" class="text-2xl sm:text-3xl font-black gold-accent">200 <span class="text-xs font-bold text-primary-title" data-i18n="currency">DH</span></span>
                </div>
                <button id="btn-submit-bundle" onclick="submitBundle()" disabled class="w-full sm:w-auto bg-amber-600 dark:bg-amber-500 hover:bg-amber-700 dark:hover:bg-amber-400 text-white dark:text-black font-black px-6 py-3.5 rounded-xl opacity-50 cursor-not-allowed transition text-xs sm:text-sm flex items-center justify-center gap-2 shadow-md">
                    <span data-i18n="orderWhatsApp">Commander via WhatsApp</span> <i class="fa-brands fa-whatsapp text-lg"></i>
                </button>
            </div>
        </div>
    </section>

    <!-- All Products -->
    <section class="max-w-7xl mx-auto px-3 sm:px-6 my-8 w-full">
        <h3 class="text-lg sm:text-xl font-extrabold mb-6 flex items-center gap-2 text-primary-title">
            <i class="fa-solid fa-gem gold-accent"></i> <span data-i18n="allPerfumes">Tous les Parfums</span>
        </h3>
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6"></div>
    </section>

    <!-- Modal Selection -->
    <div id="perfume-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-3 sm:p-4 backdrop-blur-sm">
        <div class="card-box bg-white dark:bg-gray-900 border-2 border-amber-500/40 w-full max-w-md rounded-2xl sm:rounded-3xl p-4 sm:p-6 relative max-h-[85vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-amber-500/20">
                <h4 class="font-extrabold text-primary-title text-sm sm:text-base" data-i18n="selectPerfume">Choisir un Parfum</h4>
                <button onclick="closeModal()" class="text-gray-400 hover:text-amber-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="modal-perfumes-list" class="grid grid-cols-2 gap-2.5 sm:gap-3 overflow-y-auto p-1"></div>
        </div>
    </div>

    <!-- Firebase & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyOwrJ2FRONVggeXeKcnuZYOq...",
            authDomain: "parfum-e53ad.firebaseapp.com",
            projectId: "parfum-e53ad",
            storageBucket: "parfum-e53ad.firebasestorage.app",
            messagingSenderId: "791467480753",
            appId: "1:791467480753:web:4c370bfe3635a37686f490"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- 1. Dictionnaire des Langues ---
        const translations = {
            FR: {
                dir: "ltr",
                admin: "Admin",
                heroTitle: "Monde des Parfums de Luxe",
                heroSub: "Une collection exclusive aux touches boisées, fraîches et florales.",
                offerTitle: "Composez votre Pack",
                offerSub: "Cliquez pour choisir 3 parfums parmi les plus vendus.",
                totalPrice: "Prix total du pack:",
                currency: "DH",
                orderWhatsApp: "Commander via WhatsApp",
                allPerfumes: "Tous les Parfums",
                selectPerfume: "Choisir un Parfum",
                orderNow: "Commander",
                noOfferPerfumes: "Aucun parfum disponible pour le moment.",
                whatsappMsg: "Bonjour, je souhaite commander le pack de 3 parfums à 200 DH:\n- Parfums sélectionnés: "
            },
            AR: {
                dir: "rtl",
                admin: "لوحة التحكم",
                heroTitle: "عالم العطور الفاخرة",
                heroSub: "تشكيلة حصرية بلمسات خشبية، منعشة، وزهرية ساحرة.",
                offerTitle: "ركّب باقتك",
                offerSub: "اضغط لاختيار 3 عطور من الأكثر مبيعاً.",
                totalPrice: "السعر الإجمالي للباقة:",
                currency: "درهم",
                orderWhatsApp: "اطلب باقتك عبر الواتساب",
                allPerfumes: "جميع العطور المتاحة",
                selectPerfume: "اختر عطر للخانة",
                orderNow: "طلب الآن",
                noOfferPerfumes: "لا توجد عطور محددة للعرض حالياً.",
                whatsappMsg: "مرحباً، أود طلب باقة 3 عطور بـ 200 درهم:\n- العطور المختارة: "
            },
            EN: {
                dir: "ltr",
                admin: "Admin",
                heroTitle: "World of Luxury Perfumes",
                heroSub: "An exclusive collection with woody, fresh, and floral notes.",
                offerTitle: "Build Your Pack",
                offerSub: "Click to choose 3 perfumes from our best sellers.",
                totalPrice: "Total pack price:",
                currency: "DH",
                orderWhatsApp: "Order via WhatsApp",
                allPerfumes: "All Perfumes",
                selectPerfume: "Select a Perfume",
                orderNow: "Order Now",
                noOfferPerfumes: "No perfumes available right now.",
                whatsappMsg: "Hello, I would like to order the 3 perfume pack for 200 DH:\n- Selected perfumes: "
            }
        };

        let currentLang = "FR";

        window.changeLanguage = (lang) => {
            currentLang = lang;
            const t = translations[lang];
            document.documentElement.lang = lang.toLowerCase();
            document.documentElement.dir = t.dir;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(t[key]) el.innerText = t[key];
            });

            loadProducts();
        };

        // --- 2. Theme Toggle (Dark / Light) ---
        window.toggleTheme = () => {
            const isDark = document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            if (isDark) {
                icon.className = "fa-solid fa-sun text-sm";
                localStorage.setItem('theme', 'dark');
            } else {
                icon.className = "fa-solid fa-moon text-sm";
                localStorage.setItem('theme', 'light');
            }
        };

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-icon').className = "fa-solid fa-moon text-sm";
        }

        // --- 3. App Logic ---
        let selectedBundle = [null, null, null];
        let currentSlot = 0;
        let availableOfferPerfumes = [];

        async function loadSettings() {
            try {
                const sDoc = await getDoc(doc(db, "settings", "general"));
                if(sDoc.exists()) {
                    const data = sDoc.data();
                    if(data.logo) {
                        document.getElementById('nav-brand').innerHTML = `<img src="${data.logo}" class="h-8 sm:h-10 object-contain">`;
                    }
                    if(data.offerTitle) document.getElementById('display-offer-title').innerText = data.offerTitle;
                    if(data.offerSub) document.getElementById('display-offer-sub').innerText = data.offerSub;
                    if(data.offerPrice) {
                        const curr = translations[currentLang].currency;
                        document.getElementById('display-offer-price').innerHTML = `${data.offerPrice} <span class="text-xs font-bold text-primary-title">${curr}</span>`;
                    }
                }
            } catch(e){}
        }

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            const snap = await getDocs(collection(db, "products"));
            grid.innerHTML = '';
            availableOfferPerfumes = [];

            const t = translations[currentLang];

            snap.forEach(d => {
                const p = d.data();
                if(p.allowOffer) availableOfferPerfumes.push(p);

                grid.innerHTML += `
                    <div class="card-box rounded-2xl overflow-hidden hover:border-amber-500 transition duration-300 flex flex-col justify-between">
                        <img src="${p.imageUrl}" class="w-full h-48 sm:h-56 object-cover">
                        <div class="p-4 flex-grow flex flex-col justify-between">
                            <div>
                                <h4 class="font-extrabold text-primary-title text-sm sm:text-base">${p.name}</h4>
                                <p class="text-secondary-sub text-xs my-2 line-clamp-2">${p.description || ''}</p>
                            </div>
                            <div class="flex justify-between items-center mt-3 pt-2 border-t border-amber-500/20">
                                <span class="gold-accent font-extrabold text-sm sm:text-base">${p.price} ${t.currency}</span>
                                <button onclick="alert('${t.orderWhatsApp}')" class="bg-amber-500/10 text-amber-700 dark:text-amber-400 border border-amber-500/30 font-bold px-3 py-1.5 rounded-xl text-xs hover:bg-amber-500 hover:text-white dark:hover:text-black transition">${t.orderNow}</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.openPerfumeSelector = (slotIndex) => {
            currentSlot = slotIndex;
            const modalList = document.getElementById('modal-perfumes-list');
            modalList.innerHTML = '';
            const t = translations[currentLang];

            if(availableOfferPerfumes.length === 0) {
                modalList.innerHTML = `<p class="text-secondary-sub text-xs text-center col-span-2 py-6">${t.noOfferPerfumes}</p>`;
            } else {
                availableOfferPerfumes.forEach(p => {
                    modalList.innerHTML += `
                        <div onclick="selectPerfumeForSlot('${p.name}', '${p.imageUrl}')" class="bg-slate-100 dark:bg-gray-800 hover:bg-amber-500/20 p-2 rounded-xl cursor-pointer flex flex-col items-center border border-amber-500/30 text-center transition">
                            <img src="${p.imageUrl}" class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-lg mb-1.5">
                            <span class="text-[11px] font-extrabold text-primary-title line-clamp-1">${p.name}</span>
                        </div>
                    `;
                });
            }
            document.getElementById('perfume-modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('perfume-modal').classList.add('hidden');

        window.selectPerfumeForSlot = (name, img) => {
            selectedBundle[currentSlot] = { name, img };
            
            document.getElementById(`slot-content-${currentSlot}`).innerHTML = `
                <img src="${img}" class="w-16 h-16 sm:w-24 sm:h-24 md:w-28 md:h-28 object-cover rounded-lg sm:rounded-xl shadow mb-1">
                <span class="text-[10px] sm:text-[11px] font-extrabold gold-accent line-clamp-1">${name}</span>
            `;
            closeModal();
            updateCounter();
        };

        function updateCounter() {
            const count = selectedBundle.filter(x => x !== null).length;
            document.getElementById('bundle-counter').innerText = `${count}/3`;
            
            const btn = document.getElementById('btn-submit-bundle');
            if(count === 3) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        window.submitBundle = () => {
            const t = translations[currentLang];
            const names = selectedBundle.map(p => p.name).join(' + ');
            const msg = `${t.whatsappMsg}(${names})`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        };

        async function loadSlider() {
            try {
                const snap = await getDocs(collection(db, "slider"));
                const imgs = [];
                snap.forEach(d => imgs.push(d.data().url));
                if(imgs.length > 0) {
                    let i = 0;
                    setInterval(() => {
                        i = (i + 1) % imgs.length;
                        document.getElementById('slider-img').src = imgs[i];
                    }, 4000);
                }
            }catch(e){}
        }

        // Init App
        changeLanguage('FR');
        loadSettings();
        loadProducts();
        loadSlider();
    </script>
</body>
</html>
