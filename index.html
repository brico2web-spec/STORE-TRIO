    ac.innerHTML=`<div class="flex gap-2 mb-4"><button onclick="navigator.clipboard.writeText(JSON.stringify(S.orders));alert('copied')" class="h-[36px] px-4 rounded-full bg-white border text-[12px] font-bold">Export JSON</button><button onclick="if(confirm('Effacer tout ?')){S.orders=[];save();render()}" class="h-[36px] px-4 rounded-full bg-red-50 border border-red-200 text-red-600 text-[12px] font-bold">Effacer</button></div><div class="overflow-auto border rounded-[16px]"><table class="w-full text-[12px]"><thead class="bg-black text-white"><tr><th class="p-2 text-left">N°</th><th class="p-2">Date</th><th class="p-2">Client</th><th class="p-2">Tel</th><th class="p-2">Ville</th><th class="p-2">Total</th><th class="p-2">Statut</th></tr></thead><tbody>${S.orders.length===0?`<tr><td colspan="7" class="p-8 text-center text-zinc-400">Aucune commande</td></tr>`:S.orders.map(o=>`<tr class="border-t"><td class="p-2 font-bold">${o.id}</td><td class="p-2">${o.date}</td><td class="p-2">${o.client}</td><td class="p-2">${o.phone}</td><td class="p-2">${o.city}</td><td class="p-2 font-bold">${o.total} MAD</td><td class="p-2"><select onchange="S.orders.find(x=>x.id==='${o.id}').status=this.value;save()" class="h-[28px] rounded-full border px-2 text-[11px]"><option ${o.status==='En attente'?'selected':''}>En attente</option><option ${o.status==='Confirmée'?'selected':''}>Confirmée</option><option ${o.status==='Livrée'?'selected':''}>Livrée</option></select></td></tr>`).join('')}</tbody></table></div>`
   } else if(S.adminTab==='Footer & Maps'){
    ac.innerHTML=`<div class="grid md:grid-cols-2 gap-6"><div class="space-y-3"><label class="text-[12px] font-bold">About FR</label><textarea oninput="S.footer.about.FR=this.value;save()" class="w-full min-h-[80px] rounded-[12px] border p-3 text-[13px]">${S.footer.about.FR}</textarea><label class="text-[12px] font-bold">About AR</label><textarea oninput="S.footer.about.AR=this.value;save()" class="w-full min-h-[80px] rounded-[12px] border p-3 text-[13px]">${S.footer.about.AR}</textarea><input value="${S.footer.addr}" oninput="S.footer.addr=this.value;save()" class="w-full h-[44px] rounded-full border px-4 text-[13px]" placeholder="Adresse"><div class="grid grid-cols-2 gap-2"><input value="${S.footer.phone}" oninput="S.footer.phone=this.value;save()" class="h-[44px] rounded-full border px-4 text-[13px]" placeholder="Phone"><input value="${S.footer.email}" oninput="S.footer.email=this.value;save()" class="h-[44px] rounded-full border px-4 text-[13px]" placeholder="Email"></div><div class="border rounded-[16px] p-4 bg-[#f8fafc] space-y-2"><label class="text-[12px] font-bold">🗺️ Google Maps - عنوان أو رابط</label><input value="${S.footer.map}" oninput="S.footer.map=this.value;save();render()" class="w-full h-[44px] rounded-full border px-4 text-[13px]" placeholder="Kenitra, Morocco أو رابط embed"><label class="flex items-center gap-2 text-[12px] font-bold"><input type="checkbox" ${S.showMap?'checked':''} onchange="S.showMap=this.checked;save();render()"> إظهار الخريطة فالفوتر</label><p class="text-[11px] text-zinc-500">اكتب فقط المدينة: Kenitra, Morocco وغادي تولي خريطة أوتوماتيك</p></div><button onclick="save();alert('Footer saved')" class="btn bg-black text-white">حفظ الفوتر والخريطة</button></div><div><div class="text-[12px] font-bold mb-2">معاينة الخريطة الحية 300px</div>${S.showMap?(S.footer.map?`<iframe src="https://www.google.com/maps?q=${encodeURIComponent(S.footer.map)}&z=14&output=embed" class="w-full h-[300px] rounded-[16px] border"></iframe>`:`<div class="h-[300px] rounded-[16px] border-2 border-dashed grid place-items-center text-zinc-400">أضف عنوان</div>`):`<div class="h-[100px] rounded-[16px] border border-dashed grid place-items-center text-zinc-400">مخفية</div>`}</div></div>`
   } else if(S.adminTab==='Top Bar'){
    ac.innerHTML=`<div class="grid md:grid-cols-2 gap-6"><div class="space-y-3"><label class="text-[12px] font-bold">Messages FR</label><textarea oninput="S.top.msg.FR=this.value;save()" class="w-full min-h-[80px] rounded-[12px] border p-3 text-[13px]">${S.top.msg.FR}</textarea><label class="text-[12px] font-bold">Messages AR</label><textarea oninput="S.top.msg.AR=this.value;save()" class="w-full min-h-[80px] rounded-[12px] border p-3 text-[13px]">${S.top.msg.AR}</textarea><div class="grid grid-cols-2 gap-2"><input type="color" value="${S.top.bg}" oninput="S.top.bg=this.value;save();render()" class="w-full h-[48px] rounded-[12px]"><input type="color" value="${S.top.color}" oninput="S.top.color=this.value;save();render()" class="w-full h-[48px] rounded-[12px]"></div><label class="flex items-center gap-2 text-[12px]"><input type="checkbox" ${S.top.show?'checked':''} onchange="S.top.show=this.checked;save();render()"> إظهار الشريط</label><button onclick="save();render();alert('Top saved')" class="btn bg-black text-white">حفظ Top Bar</button></div><div><div class="h-[36px] rounded-[12px] flex items-center overflow-hidden" style="background:${S.top.bg};color:${S.top.color}"><div class="marquee whitespace-nowrap text-[11px] font-bold tracking-widest uppercase" style="--speed:${S.top.speed}">${S.top.msg[S.lang]} — ${S.top.msg[S.lang]}</div></div></div></div>`
   } else if(S.adminTab==='Paramètres'){
    ac.innerHTML=`<div class="space-y-4 max-w-[600px]"><div class="border rounded-[16px] p-4"><h3 class="font-bold mb-2">🌐 اللغة الافتراضية</h3><div class="flex gap-2">${['FR','AR','EN'].map(l=>`<button onclick="S.lang='${l}';save();render()" class="h-[36px] px-4 rounded-full border text-[12px] font-bold ${S.lang===l?'bg-black text-white':''}">${l}</button>`).join('')}</div></div><div class="border rounded-[16px] p-4 bg-[#f8fafc]"><h3 class="font-bold mb-2">⚙️ معلومات عامة</h3><div class="grid grid-cols-2 gap-2 text-[11px]"><div class="p-2 rounded-[10px] bg-white border">Logo Top: ${S.logoTop?'✅':'❌'}</div><div class="p-2 rounded-[10px] bg-white border">Logo Foot: ${S.logoFoot?'✅':'❌'}</div><div class="p-2 rounded-[10px] bg-white border">Map: ${S.footer.map?'✅':''} ${S.showMap?'Visible':'Masquée'}</div><div class="p-2 rounded-[10px] bg-white border">Langue: ${S.lang}</div></div></div><div class="border rounded-[16px] p-4"><h3 class="font-bold mb-2 text-red-600">Danger zone</h3><button onclick="if(confirm('مسح كل شيء ؟')){localStorage.clear();location.reload()}" class="h-[40px] px-4 rounded-full bg-red-600 text-white text-[12px] font-bold">مسح كل البيانات</button></div></div>`
   }
  }
 },0)
}

let pickIdx=null;
window.openPick=i=>{pickIdx=i; S.picks._idx=i; document.getElementById('pickIdx').textContent=i+1; document.getElementById('pickModal').classList.remove('hidden')}
window.closePick=()=>document.getElementById('pickModal').classList.add('hidden')
window.pick=id=>{if(pickIdx!==null){S.picks[pickIdx]=id; closePick(); render()}}
window.clearPick=()=>{if(pickIdx!==null){S.picks[pickIdx]=null; closePick(); render()}}
window.addPack=buy=>{if(S.picks.filter(Boolean).length!==3){alert(S.lang==='AR'?'اختر 3 عطور أولا':'Choisissez 3 parfums'); return} S.showCart=false; if(buy){S.showCheckout=true} else { S.cart.push({id:'pack-'+Date.now(), name:'PACK CLASSIC', price:200*S.qty, qty:1, type:'pack', detail:S.picks.map(id=>S.products.find(p=>p.id===id)?.name).join(' + ')}); S.showCart=true} render()}
window.addProd=id=>{const p=S.products.find(x=>x.id===id); const ex=S.cart.find(x=>x.id===p.id); if(ex) ex.qty++; else S.cart.push({id:p.id,name:p.name,price:p.price,qty:1}); S.showCart=true; render()}
window.confirmOrder=()=>{const name=document.getElementById('cName').value, phone=document.getElementById('cPhone').value, city=document.getElementById('cCity').value, addr=document.getElementById('cAddr').value; if(!name||!phone||!addr){alert('املأ جميع الحقول / Remplissez tous les champs'); return} const total=S.cart.reduce((a,b)=>a+b.price*b.qty,0)+(S.picks.filter(Boolean).length===3?200*S.qty:0); const order={id:'#'+Math.floor(10000+Math.random()*90000), date:new Date().toLocaleString(), client:name, phone, city, address:addr, products:[...S.cart, ...(S.picks.filter(Boolean).length===3?[{name:'PACK CLASSIC ('+S.picks.map(id=>S.products.find(p=>p.id===id)?.name).join(' + ')+')', qty:S.qty, price:200*S.qty}]:[])], total, status:'En attente'}; S.orders.unshift(order); S.thank=order; S.cart=[]; S.picks=[null,null,null]; S.showCheckout=false; save(); render(); window.scrollTo({top:0,behavior:'smooth'})}
window.uploadLogo=(inp,type)=>{const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{if(type==='top'){S.logoTop=e.target.result; LS.set('sentel_logo_top',S.logoTop)} else {S.logoFoot=e.target.result; LS.set('sentel_logo_footer',S.logoFoot)} save(); render()}; r.readAsDataURL(f)}
window.uploadSlide=(inp,i)=>{const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{S.slider[i].img=e.target.result; save(); render()}; r.readAsDataURL(f)}
window.uploadProd=(inp,i)=>{const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{S.products[i].img=e.target.result; save(); render()}; r.readAsDataURL(f)}

render();
</script>
</body>
</html>
